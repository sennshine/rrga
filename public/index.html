<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Uninformed Agents Simulation</title>

  <!-- Mapbox SDK -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet"/>

  <!-- Mapbox Directions -->
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-directions/v4.1.1/mapbox-gl-directions.js"></script>
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-directions/v4.1.1/mapbox-gl-directions.css"/>

  <!-- Global evacuation & road closures -->
  <script>
    window.evacuationSites = [
      { name: "Dewan Selagon", area: "Beaufort", coordinates: [115.739, 5.398] },
      { name: "Dewan PSP Dun Banir", area: "Beaufort", coordinates: [115.733, 5.354] },
      { name: "Dewan Masyarakat Keningau", area: "Keningau", coordinates: [116.161, 5.345] },
      { name: "Dewan Serbaguna Pekan", area: "Keningau", coordinates: [116.156, 5.337] },
      { name: "Datuk Seri Panglima Antanom Hall", area: "Tenom", coordinates: [115.944, 5.124] },
      { name: "SK Pekan Tenom", area: "Tenom", coordinates: [115.945, 5.127] }
    ];

    window.roadClosures = [
      { name: "Jalan Keningau-Kimanis", start: [116.0696, 5.4596], end: [116.0973, 5.3959] },
      { name: "Jalan Lumatai", start: [115.7315, 5.3479], end: [115.7311, 5.3479] },
      { name: "Jalan Pak Musa", start: [115.7464, 5.3444], end: [115.7462, 5.3446] }
    ];
  </script>

  <!-- Simulation logic -->
  <script src="uninformedAgents.js" defer></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    h1 {
      text-align: center;
      padding: 15px;
      margin: 0;
      background-color: #f8f8f8;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 1px solid #ddd;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    #sim-controls {
      position: absolute;
      bottom: 10px;
      left: 10px;
      z-index: 999;
      background: rgba(255, 255, 255, 0.95);
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.2);
      max-width: 240px;
      font-size: 14px;
    }

    #sim-controls button {
      width: 100%;
      margin-bottom: 10px;
      padding: 10px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #startBtn {
      background-color: #28a745;
    }

    #stopBtn {
      background-color: #dc3545;
    }

    #arrivedCount {
      font-weight: bold;
      margin: 0 0 10px 0;
    }

    #table-wrapper {
      position: absolute;
      top: 70px;
      right: 40px;
      z-index: 999;
      max-height: 300px;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.95);
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 0 3px rgba(0,0,0,0.2);
      font-size: 13px;
    }

    #table-wrapper table {
      width: 100%;
      border-collapse: collapse;
    }

    #table-wrapper th,
    #table-wrapper td {
      border: 1px solid #ccc;
      padding: 6px 8px;
      text-align: center;
    }

    #table-wrapper thead {
      background-color: #f0f0f0;
      position: sticky;
      top: 0;
    }

    .mapboxgl-ctrl-attrib {
      display: none !important;
    }
  </style>
</head>
<body>
  <h1>Uninformed Agents Simulation</h1>
  <div id="map"></div>

  <!-- Bottom-left Controls -->
  <div id="sim-controls">
    <button id="startBtn">Start Simulation</button>
    <button id="stopBtn">Stop Simulation</button>
    <p id="arrivedCount">Arrived: 0</p>
  </div>

  <!-- Top-right Table -->
  <div id="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Agent ID</th>
          <th>District</th>
          <th>Time Taken(s)</th>
          <th>Distance(km)</th>
        </tr>
      </thead>
      <tbody id="arrivalTableBody"></tbody>
    </table>
  </div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1Ijoid3NuYzAiLCJhIjoiY204eDR2eXM1MDBoeDJrb3RxcWcycGh0MSJ9.RrkeTWJCa3lhoQJsTq_EBQ';

    const origin = [115.542913, 5.298978];

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v12',
      center: origin,
      zoom: 10,
      pitch: 45
    });

    map.addControl(new mapboxgl.NavigationControl());

    function addRoadblockMarker(position) {
      const el = document.createElement('img');
      el.src = 'roadblock.png';
      el.alt = 'Roadblock';
      el.style.width = '25px';
      el.style.height = '25px';

      new mapboxgl.Marker(el)
        .setLngLat(position)
        .setPopup(new mapboxgl.Popup().setText('Road Block'))
        .addTo(map);
    }

    function drawBlockedRoad(road) {
      fetch(`https://api.mapbox.com/directions/v5/mapbox/driving/${road.start[0]},${road.start[1]};${road.end[0]},${road.end[1]}?geometries=geojson&access_token=${mapboxgl.accessToken}`)
        .then(res => res.json())
        .then(data => {
          if (data.routes && data.routes.length > 0) {
            const coords = data.routes[0].geometry.coordinates;
            map.addSource(road.name, {
              type: 'geojson',
              data: { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } }
            });

            map.addLayer({
              id: road.name,
              type: 'line',
              source: road.name,
              layout: { 'line-join': 'round', 'line-cap': 'round' },
              paint: { 'line-color': 'purple', 'line-width': 5 }
            });
          }
        });
    }

    function isRoadBlockedAt([lon, lat]) {
      return window.roadClosures.some(road => {
        const dist = (p1, p2) => Math.sqrt((p1[0] - p2[0]) ** 2 + (p1[1] - p2[1]) ** 2);
        return dist([lon, lat], road.start) < 0.01 || dist([lon, lat], road.end) < 0.01;
      });
    }

    map.on('load', () => {
      window.evacuationSites.forEach(site => {
        new mapboxgl.Marker({ color: '#00FF00' })
          .setLngLat(site.coordinates)
          .setPopup(new mapboxgl.Popup().setHTML(`<strong>${site.name}</strong><br>${site.area}`))
          .addTo(map);
      });

      window.roadClosures.forEach(road => {
        drawBlockedRoad(road);
        addRoadblockMarker(road.start);
        addRoadblockMarker(road.end);
      });

      map.addSource('route', {
        type: 'geojson',
        data: {
          type: 'Feature',
          geometry: { type: 'LineString', coordinates: [] }
        }
      });

      map.addLayer({
        id: 'route',
        type: 'line',
        source: 'route',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: { 'line-color': '#ff0000', 'line-width': 5 }
      });
    });
  </script>
</body>
</html>
