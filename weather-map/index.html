<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sabah Wind Flow Map - AccuWeather Style</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Mapbox -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />

  <!-- wind-gl -->
  <script src="https://unpkg.com/wind-gl@0.0.7/dist/wind-gl.js"></script>
  <script>
    const WindLayer = window['wind-gl'].WindLayer;
  </script>

  <style>
    body { margin: 0; padding: 0; background: #000; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }

    .weather-box {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.85);
      padding: 12px;
      font-family: Arial, sans-serif;
      border-radius: 8px;
      max-width: 300px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.6);
      color: white;
    }

    .weather-box h3 {
      margin: 0 0 10px;
      font-size: 16px;
      color: #fff;
    }

    #weather-data {
      width: 100%;
      border-collapse: collapse;
    }

    #weather-data th, #weather-data td {
      text-align: left;
      padding: 4px;
      border-bottom: 1px solid #444;
      font-size: 14px;
    }

    #weather-data th {
      color: #ccc;
    }

    .loading {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 8px 12px;
      font-family: sans-serif;
      font-size: 13px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div id="map"></div>

<div id="weather-table" class="weather-box">
  <h3>Sabah District Weather</h3>
  <table id="weather-data">
    <thead>
      <tr>
        <th>District</th>
        <th>Temp (°C)</th>
        <th>Wind (m/s)</th>
      </tr>
    </thead>
    <tbody>
      <!-- Dynamic rows -->
    </tbody>
  </table>
</div>

<div id="loading" class="loading">Loading wind particles...</div>

<script>
  mapboxgl.accessToken = 'pk.eyJ1Ijoic29mLWUtYW5uYSIsImEiOiJjbTkwcmU2OXMwYjFvMmtwcTA1cTVuam91In0.6vQJjS11pD9-Xdno_P8hdg';

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/dark-v10',
    center: [116.0753, 5.9788],
    zoom: 6.5
  });

  const locations = [
    { name: "Kota Kinabalu", lat: 5.9804, lon: 116.0735 },
    { name: "Sandakan", lat: 5.8400, lon: 118.1170 },
    { name: "Tawau", lat: 4.2447, lon: 117.8912 },
    { name: "Lahad Datu", lat: 5.0201, lon: 118.3280 },
    { name: "Keningau", lat: 5.3371, lon: 116.1611 },
    { name: "Beaufort", lat: 5.3472, lon: 115.7441 },
    { name: "Kudat", lat: 6.8833, lon: 116.8333 },
    { name: "Ranau", lat: 6.0200, lon: 116.6700 }
  ];

  async function getWeather(lat, lon) {
    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,wind_speed_10m&timezone=auto`);
    const data = await res.json();
    return {
      temperature: data.hourly.temperature_2m[0],
      wind: data.hourly.wind_speed_10m[0]
    };
  }

  map.on('load', async () => {
    const tableBody = document.querySelector('#weather-data tbody');

    // Hide built-in POI icons for a cleaner look
    const layers = map.getStyle().layers;
    layers.forEach(layer => {
      if (layer.id.includes('poi') || layer.id.includes('poi-label')) {
        map.setLayoutProperty(layer.id, 'visibility', 'none');
      }
    });

    // Load weather table
    for (const loc of locations) {
      const weather = await getWeather(loc.lat, loc.lon);
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${loc.name}</td>
        <td>${weather.temperature}</td>
        <td>${weather.wind}</td>
      `;
      tableBody.appendChild(row);
    }

    // ✅ Sample wind data — static for visual effect
    const sampleWindData = {
      header: {
        nx: 20,
        ny: 20,
        lo1: 114.5,
        la1: 7.5,
        lo2: 118.5,
        la2: 3.5,
        dx: 0.2,
        dy: 0.2,
        refTime: "2025-04-03T00:00Z"
      },
      data: {
        u: Array(400).fill(6),
        v: Array(400).fill(2.5)
      }
    };

    const windLayer = new WindLayer('wind', {
      mapbox: map,
      windData: sampleWindData,
      windOptions: {
        velocityScale: 0.03,
        paths: 8000,
        fadeOpacity: 0.9,
        dropRate: 0.003,
        speedFactor: 1.5,
        colorScale: [
          "rgba(160,160,255,0.1)",
          "rgba(160,160,255,0.3)",
          "rgba(170,170,255,0.5)",
          "rgba(200,200,255,0.6)",
          "rgba(230,230,255,0.8)",
          "rgba(255,255,255,1.0)"
        ]
      }
    });

    map.addLayer(windLayer);
    document.getElementById("loading").style.display = "none";
  });
</script>

</body>
</html>
