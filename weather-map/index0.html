<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sabah Weather Map with Wind Arrows</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }

    .weather-box {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px;
      font-family: Arial, sans-serif;
      border-radius: 8px;
      max-width: 300px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .weather-box h3 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    #weather-data {
      width: 100%;
      border-collapse: collapse;
    }

    #weather-data th, #weather-data td {
      text-align: left;
      padding: 4px;
      border-bottom: 1px solid #ccc;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div id="map"></div>

<div id="weather-table" class="weather-box">
  <h3>Sabah District Weather</h3>
  <table id="weather-data">
    <thead>
      <tr>
        <th>District</th>
        <th>Temp (°C)</th>
        <th>Wind (m/s)</th>
      </tr>
    </thead>
    <tbody>
      <!-- Dynamic rows -->
    </tbody>
  </table>
</div>

<script>
  // Replace with your actual Mapbox token
  mapboxgl.accessToken = 'pk.eyJ1Ijoic29mLWUtYW5uYSIsImEiOiJjbTkwcmU2OXMwYjFvMmtwcTA1cTVuam91In0.6vQJjS11pD9-Xdno_P8hdg';

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/satellite-streets-v12',
    center: [116.0753, 5.9788],
    zoom: 6
  });

  const locations = [
    { name: "Kota Kinabalu", lat: 5.9804, lon: 116.0735 },
    { name: "Sandakan", lat: 5.8400, lon: 118.1170 },
    { name: "Tawau", lat: 4.2447, lon: 117.8912 },
    { name: "Lahad Datu", lat: 5.0201, lon: 118.3280 },
    { name: "Keningau", lat: 5.3371, lon: 116.1611 },
    { name: "Beaufort", lat: 5.3472, lon: 115.7441 },
    { name: "Kudat", lat: 6.8833, lon: 116.8333 },
    { name: "Ranau", lat: 6.0200, lon: 116.6700 }
  ];

  async function getWeather(lat, lon) {
    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,wind_speed_10m,wind_direction_10m&timezone=auto`);
    const data = await res.json();
    return {
      temperature: data.hourly.temperature_2m[0],
      wind: data.hourly.wind_speed_10m[0],
      direction: data.hourly.wind_direction_10m[0]
    };
  }

  map.on('load', async () => {
    const tableBody = document.querySelector('#weather-data tbody');

    // Load wind arrow image once
    map.loadImage('https://cdn-icons-png.flaticon.com/512/892/892354.png', (error, image) => {
      if (error) throw error;
      if (!map.hasImage('arrow-icon')) {
        map.addImage('arrow-icon', image, { sdf: true });
      }
    });

    for (const loc of locations) {
      const weather = await getWeather(loc.lat, loc.lon);

      // Add to table
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${loc.name}</td>
        <td>${weather.temperature}</td>
        <td>${weather.wind}</td>
      `;
      tableBody.appendChild(row);

      // Add popup marker
      const popup = new mapboxgl.Popup({ offset: 25 }).setHTML(`
        <strong>${loc.name}</strong><br>
        🌡️ Temp: ${weather.temperature}°C<br>
        💨 Wind: ${weather.wind} m/s
      `);

      new mapboxgl.Marker()
        .setLngLat([loc.lon, loc.lat])
        .setPopup(popup)
        .addTo(map);

      // Add wind direction symbol (arrow)
      const geojson = {
        type: 'FeatureCollection',
        features: [{
          type: 'Feature',
          geometry: {
            type: 'Point',
            coordinates: [loc.lon, loc.lat]
          },
          properties: {
            direction: weather.direction,
            speed: weather.wind
          }
        }]
      };

      const sourceId = `${loc.name}-wind`;
      const layerId = `${loc.name}-wind-layer`;

      map.addSource(sourceId, { type: 'geojson', data: geojson });

      map.addLayer({
        id: layerId,
        type: 'symbol',
        source: sourceId,
        layout: {
          'icon-image': 'arrow-icon',
          'icon-size': 0.05,
          'icon-rotate': ['get', 'direction'],
          'icon-allow-overlap': true
        },
        paint: {
          'icon-color': '#007cbf'
        }
      });
    }
  });
</script>

</body>
</html>
